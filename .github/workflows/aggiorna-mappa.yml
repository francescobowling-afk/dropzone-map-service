
name: Aggiorna mappa Dropzone Guide

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiornamento-mappa
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Esegui aggiornamento
        run: python update_feed.py

      - name: Salva dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ mappa-verificata.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento automatico dati mappa"
            git push
          fi
  